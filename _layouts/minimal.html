---
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
<head>
  {% include head.html %}
  <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}">
</head>
<body class="minimal-theme">

<div class="minimal-wrap">

<nav class="minimal-nav">
  <div class="minimal-nav__links">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/publications/' | relative_url }}">Research</a>
    <a href="{{ '/files/CV.pdf' | relative_url }}">CV</a>
  </div>
</nav>

<main class="minimal-content">
  {{ content }}
</main>

<footer class="minimal-footer">
  &copy; {{ 'now' | date: "%Y" }} {{ site.author.name }} &middot; {{ site.author.location }}
</footer>

</div>

</body>
</html>
